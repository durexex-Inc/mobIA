name: Avaliacoes de IA

# **NAO ha `paths` nem `paths-ignore` aqui.** Isto e deliberado.
#
# A semantica do GitHub Actions e assimetrica: `paths` roda se algum arquivo
# casa, mas `paths-ignore` roda se *qualquer* arquivo *nao* casa. Num PR que
# mude `src/mobia/domain/agente/classificador.py` (casa) E `README.md` (nao
# casa), os dois workflows disparam no mesmo commit com o mesmo nome de job.
# O check trivial passa primeiro e pode mascarar a falha real, liberando
# regressao de prompt -- exatamente o que este gate existe para impedir.
#
# Solucao: um workflow so, que sempre roda (exatamente um check run, nome
# estavel) mas decide no passo se o eval e necessario. Um job que passa sem
# fazer nada e silencioso demais para investigacao, entao ele registra qual
# caminho tomou.
#
# `workflow_dispatch` existe para medir sob demanda, e nao e conveniencia. Sem
# ele o gate so roda em PR que toque os caminhos filtrados, e por isso nao ha
# como medir a baseline depois que a mudanca esta na main, nem re-medir depois
# de trocar `modelo_agente`, nem investigar uma suspeita sem inventar um PR.
#
# O input `modelo` fecha metade da lacuna que o README registra: trocar
# `modelo_agente` NAO dispara este gate, porque `src/mobia/app/config.py` esta
# fora do filtro abaixo de proposito (o arquivo carrega config alheia ao
# agente). Com o input da para comparar modelos pela UI do Actions, sem commit
# e sem tocar em `config.py` -- e `_condicoes_da_execucao` ja grava o modelo no
# topo do artefato, entao cada execucao fica auto-identificada.
#
# A outra metade da lacuna continua aberta: um PR que troque o DEFAULT em
# `config.py` passa sem medir. So o filtro resolveria isso, e incluir o arquivo
# inteiro faria o gate pago rodar por motivos alheios ao agente.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo do agente. Vazio = o default de config.py."
        required: false
        default: ""
        type: string

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  avaliacoes:
    name: Avaliacoes de IA
    runs-on: ubuntu-latest
    # Este timeout e um circuit breaker, nao cobertura de pior caso teorico.
    # Tres numeros:
    #   - Estimativa realista: 136 chamadas sequenciais ao classificador (uma
    #     por turno em evals/corpus/*.yaml), poucos segundos cada, mais
    #     checkout/install -- na casa de 20min.
    #     Desde a TEC-204 somam-se ~25 chamadas ao classificador, uma ao
    #     resumidor e ~24 a moderacao em evals/test_injecao.py -- minutos,
    #     nao dezenas.
    #   - Pior caso teorico: em src/mobia/infra/anthropic.py,
    #     TIMEOUT_SEGUNDOS=60 e MAX_TENTATIVAS=1 fecham 120s por chamada se
    #     ela estourar o timeout do cliente e a retentativa tambem. 136 x
    #     120s = 16320s = 272min -- so acontece com o provedor inteiro fora
    #     do ar, cenario em que matar o job e a resposta certa, nao esperar.
    #   - 90min: >4x de folga sobre o realista, tolera lentidao substancial,
    #     e mata bem antes do default do GitHub (6h/360min), que deixaria um
    #     check obrigatorio pendurado bloqueando merge de todo mundo por
    #     quase um turno inteiro de trabalho.
    # Risco aceito: uma execucao legitimamente lenta (nao travada, so lenta)
    # pode ser morta aos 90min, perdendo as chamadas ja pagas ate ali. E o
    # preco de nao deixar o job pendurado por horas.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir se o prompt mudou
        id: filtro
        run: |
          set -euo pipefail
          # Dispatch manual nao tem PR, e portanto nao tem `base_ref`: o diff
          # receberia `origin/...HEAD` e o passo falharia. Quem dispara na mao
          # esta pedindo a medicao, entao nao ha o que filtrar.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mexeu=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Capturar git diff explicitamente e checar status antes de decidir.
          # Se o diff falhar (ref nao resolvida, ou outro erro), o passo falha
          # com mensagem clara, nao silencioso em mexeu=false que liberaria merge.
          if ! alterados="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"; then
            echo "git diff falhou: nao da para saber se o prompt mudou" >&2
            exit 1
          fi
          # Este filtro nao cobre tudo que muda o que o modelo ve ou qual
          # modelo roda. `src/mobia/domain/context/` (onde vive
          # `montar_prompt`) e `src/mobia/infra/moderacao.py` entraram na
          # TEC-204: e ali que mora a delimitacao que evals/test_injecao.py
          # mede, e o comentario anterior ja admitia o ponto cego. Um exemplo
          # conhecido continua de fora de proposito:
          #   - src/mobia/app/config.py: contem modelo_agente (qual modelo e
          #     chamado), mas tambem toda config alheia ao agente. Incluir o
          #     arquivo inteiro no filtro faria o gate pago rodar por motivos
          #     que nao tem nada a ver com o prompt ou o modelo.
          # Se um dia o gate nao rodar quando deveria, olhar aqui primeiro.
          # `.github/workflows/evals.yml` entra na lista porque mudar o gate e
          # motivo para re-medir: o filtro, o piso, o timeout e o que conta
          # como falha vivem neste arquivo. Ele nao casava com nenhum dos
          # outros padroes -- `evals/` exige que o caminho *comece* com
          # `evals/`, e este comeca com `.github/` --, e por isso um PR que
          # mexesse so no gate passava verde sem nunca exercitar o gate.
          if printf '%s\n' "$alterados" \
             | grep -qE '^(\.github/workflows/evals\.yml$|src/mobia/domain/agente/|src/mobia/domain/context/|src/mobia/infra/moderacao\.py$|src/mobia/evals/|evals/)'; then
            echo "mexeu=true" >> "$GITHUB_OUTPUT"
          else
            echo "mexeu=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.mexeu == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        if: steps.filtro.outputs.mexeu == 'true'
        run: pip install -e ".[dev]"

      # Nao ha passo de "validar o corpus" aqui. Ja existe validacao gratis
      # em dois lugares, e nenhum dos dois pode ou precisa rodar neste job:
      #   - evals/conftest.py, fixture `conversas`: carrega o corpus e confere
      #     o piso de turnos no setup, antes da primeira chamada paga do
      #     passo abaixo. Isto ja cobre "nao pagar por um corpus quebrado".
      #   - tests/unit/test_evals_corpus_real.py: guarda os invariantes
      #     completos do corpus (50 conversas, 7 intencoes, injecoes,
      #     prefixos). Ele roda no job "Testes" de ci.yml, que declara
      #     `services: postgres` e `redis` e executa em todo PR.
      # Qualquer arquivo sob `tests/` herda as fixtures `autouse` de
      # tests/conftest.py (`migrar_banco` roda `alembic upgrade head` com
      # `check=True`, `banco_limpo` faz TRUNCATE) e por isso exige Postgres.
      # Este job nao declara `services:` de proposito -- roda so Python e a
      # chave da API -- entao nenhum teste de `tests/` pode entrar aqui.
      # Ja aconteceu de alguem reintroduzir um passo assim achando que
      # evitava gasto com corpus quebrado: os 8 testes davam ERROR de
      # CalledProcessError do alembic, o passo falhava, e o check
      # obrigatorio "Avaliacoes de IA" ficava vermelho em todo PR sem nunca
      # medir nada.

      # Guarda de graca antes das 146 chamadas pagas. Um modelo com typo
      # falharia sozinho na primeira chamada, e isso seria barato -- mas um
      # modelo VALIDO e sem preco cadastrado roda a execucao inteira e produz
      # um relatorio com `custo_usd=None`, que e exatamente o buraco que a
      # TEC-249 fechou na moderacao. Aqui ele entraria de novo pela porta do
      # disparo manual.
      #
      # Reusa as duas tabelas que ja existem em vez de repetir os valores:
      # `PRECOS_POR_MODELO` e `MINIMO_CACHEAVEL_POR_MODELO`. O minimo de cache
      # nao reprova -- prefixo curto de mais nao cacheia e nao da erro, entao
      # a execucao continua valida, so mais cara --, mas avisa.
      - name: Conferir o modelo escolhido
        if: steps.filtro.outputs.mexeu == 'true' && inputs.modelo != ''
        env:
          MODELO_ESCOLHIDO: ${{ inputs.modelo }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from mobia.app.config import PRECOS_POR_MODELO
          from mobia.domain.messages.recorder import custo_em_dolar
          sys.path.insert(0, "tests/unit")
          from test_prompt_caching import PREFIXO_CACHEAVEL_EM_TOKENS, _minimo_de

          modelo = os.environ["MODELO_ESCOLHIDO"]
          if custo_em_dolar(modelo, 1000, 100) is None:
              raise SystemExit(
                  f"modelo {modelo!r} nao tem preco em PRECOS_POR_MODELO: a "
                  f"execucao rodaria inteira e o relatorio sairia com custo "
                  f"nulo. Cadastre o preco antes de medir. "
                  f"Conhecidos: {sorted(PRECOS_POR_MODELO)}"
              )
          minimo = _minimo_de(modelo)
          if minimo is None:
              print(f"[!] minimo cacheavel de {modelo!r} desconhecido")
          elif PREFIXO_CACHEAVEL_EM_TOKENS < minimo:
              print(
                  f"[!] prefixo de {PREFIXO_CACHEAVEL_EM_TOKENS} tokens contra "
                  f"minimo de {minimo} do {modelo}: SEM CACHE nesta execucao, "
                  f"e ela vai custar mais. Nao invalida a medicao."
              )
          print(f"[OK] {modelo}: preco cadastrado, minimo de cache {minimo}")
          PY

      - name: Rodar as avaliacoes
        if: steps.filtro.outputs.mexeu == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Nome intermediario de proposito: `inputs.modelo` e string vazia
          # tanto no `pull_request` quanto no dispatch sem escolha, e exportar
          # `MODELO_AGENTE=""` faria o pydantic aceitar vazio e a primeira
          # chamada falhar com modelo invalido. So vira `MODELO_AGENTE` quando
          # tem conteudo.
          MODELO_ESCOLHIDO: ${{ inputs.modelo }}
          # Fora da arvore de proposito. O default do runner e
          # `evals/relatorios/<data>.md`, e apontar para la faria o
          # `upload-artifact` abaixo ter de distinguir o relatorio desta
          # execucao dos que estao COMMITADOS no mesmo diretorio -- um glob
          # subiria os quatro historicos junto. Em `runner.temp` so existe o
          # desta execucao.
          RELATORIO_DE_EVAL: ${{ runner.temp }}/relatorio-da-execucao.md
        run: |
          set -euo pipefail
          if [ -n "${MODELO_ESCOLHIDO}" ]; then
            export MODELO_AGENTE="${MODELO_ESCOLHIDO}"
            echo "modelo forcado pelo disparo manual: ${MODELO_AGENTE}"
          else
            echo "modelo: o default de config.py"
          fi
          python -m pytest evals -v

      # `always()` e o ponto inteiro deste passo, nao um detalhe de robustez.
      #
      # Uma execucao VERMELHA e a que mais precisa ser lida turno a turno, e e
      # exatamente a que o passo anterior faz falhar. Sem `always()` o artefato
      # so existiria nas execucoes que passaram -- ou seja, so quando ninguem
      # precisa dele.
      #
      # Isto ja aconteceu: a execucao de CI que abriu VERMELHO em 30/08 perdeu
      # o relatorio, e o diagnostico saiu do log por sorte de ele ter cabido
      # ali. O runner grava o artefato ANTES das asercoes (ver `preservar` em
      # `src/mobia/evals/relatorio.py`) justamente para que exista nesse caso;
      # faltava o CI subi-lo.
      #
      # A condicao repete `mexeu` porque `always()` sozinho roda ate quando o
      # eval foi pulado, e ai nao ha arquivo nenhum para subir.
      - name: Preservar o relatorio da execucao
        if: always() && steps.filtro.outputs.mexeu == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-da-execucao-${{ github.run_number }}
          path: ${{ runner.temp }}/relatorio-da-execucao.md
          # Sem isto, uma execucao que morreu antes de gravar sobe um aviso
          # amarelo e segue. O aviso e o sinal certo: nao ter relatorio e
          # anormal, mas nao e motivo para reprovar um job que ja falhou por
          # outro motivo -- ou que passou.
          if-no-files-found: warn
          retention-days: 90

      - name: Log do resultado
        if: always()
        run: |
          if [ "${{ steps.filtro.outputs.mexeu }}" = "true" ]; then
            echo "[i] Relatorio desta execucao: artefato "
            echo "    relatorio-da-execucao-${{ github.run_number }}, na aba"
            echo "    Summary deste run. Ele sai mesmo quando o gate reprova."
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[OK] Disparo manual: avaliacoes foram executadas sem filtro"
          elif [ "${{ steps.filtro.outputs.mexeu }}" = "true" ]; then
            echo "[OK] Prompt ou eval mudou: avaliacoes foram executadas"
          else
            echo "[OK] Nenhum prompt ou eval mudou neste PR: avaliacao foi pulada"
          fi
