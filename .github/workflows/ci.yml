name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma ref cancela o build anterior: o resultado dele ja nao
# interessa e o runner e compartilhado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  qualidade:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      # Historico inteiro: o passo `citacoes em prosa` compara contra a base
      # do PR por merge-base (`base...HEAD`), e o clone raso padrao nao tem os
      # commits para calcula-lo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # `alembic` entra nos tres: as migrations importam codigo da aplicacao
      # (a 0004 chama mobia.infra.crypto) e ficavam fora de todo gate estatico.
      # `evals` entra pelo mesmo motivo: estao fora de todo gate de linting se
      # ficarmos so com `src tests`. `scripts` entra pelo terceiro caso do mesmo
      # argumento -- estava fora dos tres, e o `ruff format --check` reprovava
      # `gerar_base_simulada.py` sem que nada o dissesse. Desde a TEC-224 o
      # mypy tambem cobre `alembic`, porque `[tool.mypy].files`, no
      # pyproject.toml, lista `src` junto com `alembic` -- e `src` e o que faz
      # `mobia.*` resolver para os proprios arquivos-fonte, sem nunca
      # consultar o PEP 561. O py.typed publicado pela mesma branch NAO e a
      # causa disto: ele so limpa um `mypy alembic` isolado (sem ele, 8 erros
      # import-untyped) e publica a tipagem para quem consumir o wheel.
      # Apagar o py.typed nao tira alembic deste gate; apagar `src` do
      # `files`, sim. O escopo mora no `[tool.mypy].files`, por isso o passo
      # roda `mypy` sem argumento -- argumento de linha de comando sobrepoe o
      # `files`, entao acrescentar um diretorio novo e mexer num lugar so.
      - name: ruff check
        run: ruff check src tests alembic evals scripts

      - name: ruff format
        run: ruff format --check src tests alembic evals scripts

      - name: mypy
        run: mypy

      # TEC-299. So as duas marcas de `comentarios_tocados.py` que nao pedem
      # julgamento: ancora `arquivo.py::Nome` cujo nome nao existe, e citacao
      # por numero de linha em linha de .md que o PR acrescentou. So em PR,
      # porque LINHA precisa de uma base, e num push para a main nao ha uma
      # que faca sentido.
      - name: citacoes em prosa
        if: github.event_name == 'pull_request'
        run: python scripts/comentarios_tocados.py "origin/${{ github.base_ref }}" --checar

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSAO: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Historico inteiro: em PR o intervalo vai do merge-base ao HEAD; na
      # main, tudo. Um clone raso esconderia o commit que trouxe o segredo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binario fixado por versao e checksum, e nao a gitleaks-action: a v2
      # dela exige licenca paga em repositorio de organizacao.
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Autoteste, no molde da sentinela do bundle (TEC-302): uma allowlist
      # larga demais deixaria o gate verde para sempre sem ninguem notar. O
      # token e gerado aqui para nao existir em arquivo versionado.
      - name: Autoteste do gitleaks
        run: |
          t=$(mktemp -d)
          echo "token = \"ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)\"" > "$t/plantado.py"
          if gitleaks dir --config .gitleaks.toml --no-banner "$t"; then
            echo "::error::gitleaks nao acusou o token plantado -- a allowlist engoliu a regra"
            exit 1
          fi

      - name: Varrer os commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --config .gitleaks.toml --redact --no-banner \
              --log-opts="origin/${{ github.base_ref }}..HEAD" .
          else
            gitleaks git --config .gitleaks.toml --redact --no-banner .
          fi

  testes:
    name: Testes
    runs-on: ubuntu-latest

    # Postgres em 5433 e Redis em 6380 de proposito: sao os mesmos valores do
    # docker-compose.yml e dos defaults de Settings, entao CI e maquina local
    # rodam a mesma configuracao e nao existe um terceiro conjunto de variaveis
    # para manter em sincronia.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mobia
          POSTGRES_PASSWORD: mobia
          POSTGRES_DB: mobia
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mobia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Aplicar migrations
        run: python -m alembic upgrade head

      - name: Rodar a suite
        # O teste de latencia fica fora pelo `addopts = "-m 'not perf'"` do
        # pyproject: medir p95 em runner compartilhado seria flake, nao sinal.
        #
        # `-n auto` casa com os cores do runner; `--dist loadfile` mantem cada
        # arquivo inteiro num worker so, preservando qualquer ordem interna de
        # que um arquivo dependa. Cada worker roda contra um Postgres e um Redis
        # so dele -- ver `_isolar_por_worker` em tests/conftest.py --, senao o
        # TRUNCATE de um apagaria o estado dos outros.
        #
        # O `-n` NAO esta no `addopts` de proposito: paralelizar so compensa na
        # suite inteira. Medido, `tests/unit` sozinho piora de 4,4s para 8,6s,
        # porque a partida dos workers custa mais que os testes.
        run: python -m pytest -v -n auto --dist loadfile

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    # A sentinela da TEC-302, definida UMA vez e herdada pelo build e pela
    # varredura. Nao e segredo: ela existe justamente para ser encontrada se
    # vazar, e precisa de 16 caracteres no minimo -- curta demais, casaria
    # dentro de identificador minificado (ver `frontend/scripts/verificar-bundle.mjs`).
    #
    # **Definida uma vez porque duas copias falhariam em SILENCIO.** Se o build
    # construisse com um valor e a varredura procurasse outro, ela nao acharia
    # nada e passaria vazia -- verde, sem ter verificado coisa alguma.
    env:
      # Desde a TEC-309 e a URL do Redis, e nao mais o `MOBIA_ADMIN_TOKEN`, que
      # saiu do frontend. A senha dentro dela e a sentinela.
      MOBIA_REDIS_URL: "redis://:tec309-sentinela-da-url-nao-vaza@localhost:6379"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Os tres gates estaticos de Python (`ruff check`, `ruff format`, `mypy`)
      # NAO olham para `frontend/`: o escopo deles e `src tests alembic evals
      # scripts`, e acrescentar um diretorio de TypeScript ali nao faria
      # sentido -- nenhuma das tres ferramentas le TS. O lado JS tem os gates
      # dele aqui, e sao tres pelo mesmo motivo que os de Python sao tres:
      # passar no lint nao diz nada sobre o build.
      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build e o gate do `server-only` (TEC-302): ele reprova aqui se um
      # modulo de `lib/servidor/` for arrastado para um componente de cliente.
      #
      # `MOBIA_REDIS_URL` leva uma sentinela para o passo seguinte ter o que
      # procurar. Nao e segredo e nao precisa ser: ela existe para APARECER
      # caso vaze.
      - name: Build
        run: npm run build

      # O cenario 1 do Gherkin da TEC-302, mecanizado: procura a sentinela em
      # tudo que esta sob `.next/static`, que e o que o navegador baixa.
      #
      # E um passo separado do build de proposito, pela mesma razao que o
      # `ruff format` e separado do `ruff check`: o build passar nao diz nada
      # sobre o segredo ter ficado fora do bundle. Os dois pegam enganos
      # diferentes -- `server-only` pega a importacao do modulo no cliente, a
      # varredura pega o `NEXT_PUBLIC_` que embute o valor literal.
      - name: Varredura do bundle
        run: npm run verificar:bundle
