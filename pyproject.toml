[project]
name = "mobia"
version = "0.1.0"
description = "Agente de IA para qualificacao de leads imobiliarios"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "structlog>=24.4",
    "cryptography>=44.0",
    "anthropic>=1.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# mobia.evals so serve ao corpus/runner de evals (evals/) e a suite de dev;
# nada em producao importa esse pacote (conferido via grep). pyyaml, usado
# por mobia/evals/corpus.py, so esta no extra "dev" -- sem essa exclusao, um
# wheel instalado sem o extra dev empacota mobia.evals mas nao a dependencia
# que ele precisa, e "import mobia.evals.corpus" levanta ImportError.
exclude = ["mobia.evals", "mobia.evals.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Sem isto, `import evals...` dentro de um teste sob `tests/` so funciona por
# acidente de invocacao: `python -m pytest` poe o cwd em sys.path[0] porque
# `-m` faz isso, nao porque o pytest faz -- um `pytest` puro, ou qualquer
# wrapper que troque o cwd do processo antes de invocar, quebra o import sem
# aviso. `tests/unit/test_evals_reperguntas.py` e o primeiro teste sob
# `tests/` a importar de `evals/` (o runner pago, fora de `src/`), entao esta
# linha e a diferenca entre "roda aqui e falha em CI" e "roda igual nos dois".
pythonpath = ["."]
addopts = "-m 'not perf'"
markers = [
    "perf: teste de latencia, roda so sob demanda com -m perf",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` no default do parametro e o idioma do FastAPI, nao o bug de
# default mutavel que a B008 existe para pegar.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
