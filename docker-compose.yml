services:
  postgres:
    # pgvector nao publica imagem Alpine. A troca muda a distro base de musl
    # para glibc, e por isso o volume local e recriado e nao reaproveitado:
    # collation de texto difere entre as duas bibliotecas.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mobia
      POSTGRES_PASSWORD: mobia
      POSTGRES_DB: mobia
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobia"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    # So de desenvolvimento: captura o e-mail em vez de entregar, e serve uma
    # interface em 8025 para ler o que teria saido. Existe porque a guarda de
    # SMTP no worker e incondicional (TEC-280, D2) -- sem um servidor de pe,
    # o worker nao sobe nem aqui.
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
