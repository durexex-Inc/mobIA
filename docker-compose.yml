services:
  postgres:
    # pgvector nao publica imagem Alpine. A troca muda a distro base de musl
    # para glibc, e por isso o volume local e recriado e nao reaproveitado:
    # collation de texto difere entre as duas bibliotecas.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mobia
      POSTGRES_PASSWORD: mobia
      POSTGRES_DB: mobia
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobia"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    # So de desenvolvimento: captura o e-mail em vez de entregar, e serve uma
    # interface em 8025 para ler o que teria saido. A guarda do worker
    # (TEC-280, D2) le CONFIGURACAO -- SMTP_HOST e SMTP_REMETENTE no `.env` --,
    # nao sonda o servidor: o worker sobe sem este container de pe. O Mailpit
    # existe para que a entrega tenha para onde ir, nao para o worker subir.
    #
    # Pino em v1.31, e nao `latest`: o Mailpit nao tem v2, entao `v1` flutuaria
    # por todos os minors e seria a `latest` na pratica -- mesmo raciocinio dos
    # vizinhos (`pg16`, `7-alpine`), que pinam a serie onde mudanca quebrada
    # aterrissa. O healthcheck abaixo (`/mailpit readyz`) e uma feature
    # versionada, ausente nas series antigas: exatamente o modo de falha
    # silenciosa que o pino evita.
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
