# evals/corpus/investimento.yaml
# Convencao de anotacao, em duas partes -- transacao e finalidade.
#
# 1. TRANSACAO: compra ou aluguel. Ela nao precisa estar dita com a palavra
#    "comprar". Pergunta de preco ou de negociacao sobre imovel anunciado, sem
#    nenhuma mencao a aluguel, conta como transacao implicita de compra: e o
#    caso de `compra-04` indice 0 ("quanto ta pedindo?") e de `compra-11`
#    indice 0 ("da pra negociar o valor?"), os dois rotulados COMPRA. Quem pergunta o preco de um
#    imovel a venda esta na conversa de compra, tenha ou nao dito o verbo.
#
#    O que derruba o rotulo para INDEFINIDA e a ausencia *total* de pista de
#    transacao, e nao a falta do verbo: `borda-longa-01` indice 0 ("vi um anuncio de
#    vcs no instagram, sobre um apartamento na aclimacao") nao pergunta preco,
#    nao fala de negociacao e nao diz se o anuncio era de venda ou de locacao
#    -- ali nao ha o que inferir, e foi por isso que o turno foi corrigido para
#    INDEFINIDA.
#
# 2. FINALIDADE: morar ou render. Com a transacao de compra estabelecida (por
#    qualquer das duas vias acima) e a finalidade nao dita, o rotulo e COMPRA --
#    e o caso nao-marcado; INVESTIMENTO exige evidencia positiva de renda ou
#    revenda.
#
# A parte 1 esta escrita porque a primeira versao desta convencao falava so de
# transacao "explicita" e portanto contradizia os rotulos destes proprios
# arquivos. Os rotulos e que estao certos: sairam de dois anotadores
# independentes, e a convencao e que estava estreita.
- id: investimento-01
  descricao: o par dificil -- comprar para render, nao para morar
  turnos:
    - lead: "queria comprar um studio pra por no airbnb, qual bairro rende mais?"
      intencao: INVESTIMENTO
      campos:
        tipo_imovel: APARTAMENTO
    - lead: "qual o retorno medio que voces veem por ali?"
      intencao: INVESTIMENTO
      campos: {}
    - lead: "e o condominio costuma proibir aluguel por temporada, ou ja vem liberado?"
      intencao: INVESTIMENTO
      campos: {}

- id: investimento-02
  descricao: lead nao diz que e investidor; a pista e "revender"
  turnos:
    - lead: "tem alguma coisa na planta que valorize bem pra revender depois?"
      intencao: INVESTIMENTO
      campos: {}
    - lead: "qual a previsao de entrega desse lancamento?"
      intencao: INVESTIMENTO
      campos: {}

- id: investimento-03
  descricao: lead comeca pensando em renda e muda de ideia pra morar
  turnos:
    - lead: "to pensando em comprar um imovel pra alugar depois, algo que de bom retorno"
      intencao: INVESTIMENTO
      campos: {}
    - lead: "pensando bem, acho que vou ficar com ele mesmo pra morar, minha familia ta crescendo"
      intencao: COMPRA
      campos: {}
    - lead: "nesse caso, quais bairros voces recomendam pra crianca pequena?"
      intencao: COMPRA
      campos: {}

- id: investimento-04
  descricao: pedido comeca neutro e so na sequencia revela que e pra alugar
  turnos:
    - lead: "quero comprar um apartamento de 2 quartos na zona oeste"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
        quartos: 2
        regiao: zona oeste
    # Fora da medicao: "faz diferenca no financiamento?" pressupoe o meio em
    # vez de perguntar se pode usa-lo -- fora da forma de fala que a TEC-239
    # nomeou. Balde C do spec da TEC-245.
    - lead: "na real, e pra alugar depois no airbnb, nao pra morar. faz diferenca no financiamento?"
      intencao: INVESTIMENTO
    - lead: "voces tem algum parceiro que administra a locacao por temporada?"
      intencao: INVESTIMENTO
      campos: {}

- id: investimento-05
  descricao: diversificacao de patrimonio com imovel ja alugado
  turnos:
    # Fora da medicao: "tenho uma grana parada" sugere A_VISTA sem afirmar --
    # balde C do spec da TEC-245.
    - lead: "tenho uma grana parada e queria diversificar comprando imovel pra renda"
      intencao: INVESTIMENTO
    - lead: "voces tem algo com contrato de locacao ja em vigor, pronto pra receber aluguel?"
      intencao: INVESTIMENTO
      campos: {}
    - lead: "qual o yield medio desse tipo de imovel ja alugado?"
      intencao: INVESTIMENTO
      campos: {}

