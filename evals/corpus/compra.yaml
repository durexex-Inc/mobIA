# evals/corpus/compra.yaml
# Convencao de anotacao, em duas partes -- transacao e finalidade.
#
# 1. TRANSACAO: compra ou aluguel. Ela nao precisa estar dita com a palavra
#    "comprar". Pergunta de preco ou de negociacao sobre imovel anunciado, sem
#    nenhuma mencao a aluguel, conta como transacao implicita de compra: e o
#    caso de `compra-04` indice 0 ("quanto ta pedindo?") e de `compra-11`
#    indice 0 ("da pra negociar o valor?"), os dois rotulados COMPRA. Quem pergunta o preco de um
#    imovel a venda esta na conversa de compra, tenha ou nao dito o verbo.
#
#    O que derruba o rotulo para INDEFINIDA e a ausencia *total* de pista de
#    transacao, e nao a falta do verbo: `borda-longa-01` indice 0 ("vi um anuncio de
#    vcs no instagram, sobre um apartamento na aclimacao") nao pergunta preco,
#    nao fala de negociacao e nao diz se o anuncio era de venda ou de locacao
#    -- ali nao ha o que inferir, e foi por isso que o turno foi corrigido para
#    INDEFINIDA.
#
# 2. FINALIDADE: morar ou render. Com a transacao de compra estabelecida (por
#    qualquer das duas vias acima) e a finalidade nao dita, o rotulo e COMPRA --
#    e o caso nao-marcado; INVESTIMENTO exige evidencia positiva de renda ou
#    revenda.
#
# A parte 1 esta escrita porque a primeira versao desta convencao falava so de
# transacao "explicita" e portanto contradizia os rotulos destes proprios
# arquivos. Os rotulos e que estao certos: sairam de dois anotadores
# independentes, e a convencao e que estava estreita.
- id: compra-01
  descricao: lead abre por preco e vira aluguel quando ve o valor
  turnos:
    - lead: "oi, vi o anuncio do apto na vila mariana, ainda ta a venda?"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
        regiao: vila mariana
    # Fora da medicao: "850 mil ta bem acima do que eu consigo" sugere um
    # teto de preco que a fala nao afirma -- balde C do spec da TEC-245.
    - lead: "nossa, 850 mil ta bem acima do que eu consigo. voces tem pra alugar na regiao?"
      intencao: ALUGUEL

- id: compra-02
  descricao: lead direto, dois quartos, financiamento, fecha com uma vaga so
  turnos:
    - lead: "to procurando um dois quartos pra comprar ate 500 mil"
      intencao: COMPRA
      campos:
        quartos: 2
        faixa_preco_max: 500000
    - lead: "voces trabalham com financiamento pela caixa?"
      intencao: COMPRA
      campos:
        forma_pagamento: FINANCIAMENTO
    # Fora da medicao: "perto de metro" e proximidade sem toponimo. A forma
    # canonica reduz a frase a "metro", que nao e nome de lugar e nao filtra
    # nada -- mas tambem nao e ruido que a normalizacao descarte. Anotar `{}`
    # aqui contaria invencao contra um modelo que so repetiu o que o lead
    # disse. Mesma decisao que `borda-mista-02` indice 2, que diz a mesma
    # coisa com outras palavras.
    - lead: "e tem alguma coisa perto de metro nessa faixa?"
      intencao: COMPRA
    # Gherkin 3 do spec da TEC-145 -- "uma so" -> `vagas = 1`. A elipse esta
    # ancorada na propria fala do lead e nao na resposta do agente: o runner
    # devolve a resposta REAL ao historico, entao um "uma so" sozinho so
    # significaria vaga se o agente por acaso tivesse perguntado sobre vaga, e
    # o corpus estaria medindo sorte.
    - lead: "e quantas vagas de garagem costuma ter? pra mim uma so ja ta bom"
      intencao: COMPRA
      campos:
        vagas: 1

- id: compra-03
  descricao: lead quer usar fgts na entrada
  turnos:
    - lead: "bom dia! sera que da pra usar o fgts pra dar de entrada num apartamento?"
      intencao: COMPRA
      campos:
        forma_pagamento: FGTS
        tipo_imovel: APARTAMENTO
    - lead: "e qual documentacao voces pedem pra dar entrada no processo?"
      intencao: COMPRA
      campos: {}
    - lead: "faz quanto tempo em media do inicio ate a chave na mao?"
      intencao: COMPRA
      campos: {}

- id: compra-04
  descricao: casa acima do orcamento, lead migra pra aluguel na mesma regiao
  turnos:
    - lead: "vi que tem uma casa de 3 quartos no jardim das flores, quanto ta pedindo?"
      intencao: COMPRA
      campos:
        tipo_imovel: CASA
        quartos: 3
        regiao: jardim das flores
    # Fora da medicao: "mais que o dobro do que eu tinha em mente" e a mesma
    # forma de `compra-01` i1 -- teto sugerido, nao afirmado. Balde C do spec
    # da TEC-245.
    - lead: "poxa, e mais que o dobro do que eu tinha em mente. tem algo pra alugar por la mesmo, mais em conta?"
      intencao: ALUGUEL
    - lead: "pode ser so 2 quartos tambem, contanto que tenha quintal"
      intencao: ALUGUEL
      campos:
        quartos: 2

- id: compra-05
  descricao: familia com crianca pequena quer casa terrea
  turnos:
    - lead: "procuro uma casa terrea, com quintal, pra comprar. tem crianca pequena em casa"
      intencao: COMPRA
      campos:
        tipo_imovel: CASA
    - lead: "precisa ser financiada, nao tenho o valor todo agora"
      intencao: COMPRA
      campos:
        forma_pagamento: FINANCIAMENTO
    - lead: "voces atendem em cotia tambem?"
      intencao: COMPRA
      campos:
        regiao: cotia

- id: compra-06
  descricao: cobertura duplex, perguntas sobre lazer e condominio
  turnos:
    - lead: "vi uma cobertura duplex la no anuncio, ainda esta disponivel pra venda?"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
    - lead: "tem churrasqueira na cobertura ou so na area comum do predio?"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
    - lead: "qual o valor do condominio dessa cobertura?"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO

- id: compra-07
  descricao: lead retomando conversa, ja com financiamento aprovado
  turnos:
    - lead: "oi bom dia, sou eu de novo. fechei financiamento e quero agendar visita no apartamento que conversamos semana passada"
      intencao: COMPRA
      campos:
        forma_pagamento: FINANCIAMENTO
        tipo_imovel: APARTAMENTO
    # Fora da medicao: "pode ser sabado de manha?" nao tem ancora de semana
    # explicita, ao contrario de "essa sexta" (`follow-up-08` i1) -- balde C
    # do spec da TEC-245.
    - lead: "pode ser sabado de manha?"
      intencao: COMPRA

- id: compra-08
  descricao: solteiro procurando apto pequeno perto do trabalho, com faixa de preco fechada
  turnos:
    - lead: "queria comprar um apto pequeno, uns 40 metros, pra eu morar sozinho"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
    - lead: "tem que ser proximo do trabalho, na regiao da paulista"
      intencao: COMPRA
      campos:
        regiao: paulista
    # Fora da medicao: "parcelamento direto com o proprietario" nao e valor
    # de FormaPagamento -- balde C do spec da TEC-245.
    - lead: "aceita entrada menor com parcelamento direto com o proprietario?"
      intencao: COMPRA
    # Unico turno do corpus que afirma piso de preco. Sem "por la" no fim de
    # proposito: a anafora convidaria o modelo a repetir `regiao: paulista` do
    # turno anterior, e isso contaria `extra` -- o turno mede faixa, nao
    # memoria.
    - lead: "minha faixa e de 300 a 450 mil, abaixo disso nao acho nada decente"
      intencao: COMPRA
      campos:
        faixa_preco_min: 300000
        faixa_preco_max: 450000

- id: compra-09
  descricao: lead pergunta preco a vista, sem financiamento
  turnos:
    - lead: "quanto fica um imovel de 2 dormitorios no tatuape pra comprar a vista?"
      intencao: COMPRA
      campos:
        quartos: 2
        regiao: tatuape
        forma_pagamento: A_VISTA
    - lead: "tem desconto pagando a vista mesmo, sem financiamento?"
      intencao: COMPRA
      campos:
        forma_pagamento: A_VISTA

- id: compra-10
  descricao: casal no primeiro imovel, duvidas de processo
  turnos:
    # "primeiro imovel" afirma que nao ha imovel para vender. Como negativo
    # -- que foi como a TEC-245 o deixou -- a regua cobrava invencao de um
    # modelo que lesse a fala com razao. E o unico turno do corpus que anota
    # `tem_imovel_para_vender: false`, o caso que `preenchidos()` existe para
    # preservar.
    - lead: "minha esposa e eu queremos comprar nosso primeiro imovel, pode me ajudar a entender o processo?"
      intencao: COMPRA
      campos:
        tem_imovel_para_vender: false
    - lead: "quanto tempo demora entre a proposta e a escritura normalmente?"
      intencao: COMPRA
      campos: {}
    - lead: "e precisa de advogado por nossa conta ou voces ja indicam um?"
      intencao: COMPRA
      campos: {}

- id: compra-11
  descricao: sobrado na zona sul, negociacao e permuta
  turnos:
    - lead: "vi o anuncio do sobrado na zona sul, da pra negociar o valor?"
      intencao: COMPRA
      campos:
        regiao: zona sul
        tipo_imovel: CASA
    # Fora da medicao: permuta com carro nao e valor de FormaPagamento --
    # balde C do spec da TEC-245.
    - lead: "e aceita permuta com meu carro na entrada?"
      intencao: COMPRA
    - lead: "o sobrado tem escritura ja regularizada?"
      intencao: COMPRA
      campos:
        tipo_imovel: CASA

- id: compra-12
  descricao: mudanca pra sp, quer imovel pronto pra morar
  turnos:
    - lead: "estou de mudanca pra sp e quero comprar um apartamento mobiliado pra ja morar"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
        regiao: sao paulo
    - lead: "tem alguma coisa pronta pra morar, sem reforma?"
      intencao: COMPRA
      campos: {}
    - lead: "consigo fechar tudo a distancia, sem vir pessoalmente antes?"
      intencao: COMPRA
      campos: {}

- id: compra-13
  descricao: chacara de fim de semana, sem pressa nenhuma
  turnos:
    - lead: "queria comprar uma chacara pra passar os fins de semana com a familia, perto de sao roque"
      intencao: COMPRA
      campos:
        tipo_imovel: RURAL
        regiao: sao roque
    # Unico turno do corpus que afirma SEM_PRESSA. A barra da TEC-239 e marco
    # temporal explicito para `urgencia`, e "nao tenho pressa nenhuma" e
    # afirmacao direta de horizonte, nao entusiasmo -- o oposto simetrico de
    # "quero fechar logo", que nao anota.
    - lead: "nao tenho pressa nenhuma, quero achar o lugar certo mesmo que demore"
      intencao: COMPRA
      campos:
        urgencia: SEM_PRESSA
    - lead: "o acesso costuma ser por estrada de terra por ali?"
      intencao: COMPRA
      campos: {}

- id: compra-14
  descricao: contemplado no consorcio, carta vencendo em seis meses
  turnos:
    - lead: "fui contemplado no consorcio e quero usar a carta num apartamento de 2 quartos ate 400 mil"
      intencao: COMPRA
      campos:
        forma_pagamento: CONSORCIO
        tipo_imovel: APARTAMENTO
        quartos: 2
        faixa_preco_max: 400000
    - lead: "a carta vence em seis meses, entao preciso fechar ate la"
      intencao: COMPRA
      campos:
        urgencia: ATE_6_MESES
    # Anota pela regra da TEC-239: quem pergunta se pode usar um meio esta
    # dizendo que pretende usa-lo. Mesma forma de fala de `borda-injecao-01`
    # indice 1 e `compra-02` indice 1.
    - lead: "voces aceitam carta de consorcio de qualquer administradora?"
      intencao: COMPRA
      campos:
        forma_pagamento: CONSORCIO

- id: compra-15
  descricao: comprador que ainda nao decidiu como paga
  turnos:
    # Unico turno que afirma FormaPagamento.INDEFINIDA. Ele falou de
    # pagamento -- por isso nao e `None` -- e o que disse foi que nao
    # escolheu. Ver o docstring de `Extracao`.
    - lead: "quero comprar um apartamento na zona norte, mas ainda nao decidi se vou financiar ou pagar a vista"
      intencao: COMPRA
      campos:
        tipo_imovel: APARTAMENTO
        regiao: zona norte
        forma_pagamento: INDEFINIDA
    - lead: "voces tem plantao de visita no fim de semana?"
      intencao: COMPRA
      campos: {}
