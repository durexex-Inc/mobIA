- id: saida-bloqueia-criterio-pessoal
  texto: "Pelo seu sobrenome, acho que esse bairro não combina com o seu perfil."
  porque: criterio de atendimento baseado em caracteristica pessoal do lead

- id: saida-bloqueia-ofensa-direta
  texto: "Para de encher o saco com pergunta boba, se não tem dinheiro pra comprar nem vem."
